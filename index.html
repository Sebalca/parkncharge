<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parkncharge — estacionamento e carregamento no Porto</title>
  <meta name="description" content="Encontre e reserve lugares de estacionamento — à hora, ao dia ou ao mês, com ou sem carregamento elétrico — no Porto.">
  <meta name="theme-color" content="#436E91">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/style.css?v=0.2b">
</head>
<body>
  <section class="hero">
    <div class="hero-inner">
      <button class="searchbar" id="open-search" type="button" aria-label="Pesquisar lugares">
        <span class="sb-text"><span class="sb-main" id="sb-main">Onde vai estacionar?</span><span class="sb-sub" id="sb-sub">Qualquer altura · Carro</span></span>
        <span class="sb-fields"><span><b>Onde</b><em id="f-where">Pesquisar zona</em></span><span><b>Quando</b><em id="f-when">Qualquer altura</em></span><span><b>Veículo</b><em id="f-veh">Carro</em></span></span>
        <span class="sb-go" data-icon="search"></span>
      </button>
      <div class="cats" id="cats" role="tablist" aria-label="Categorias"></div>
    </div>
  </section>

  <main class="sheet">
    <div class="sheet-inner" id="content">
      <div class="spinner" aria-label="A carregar"></div>
    </div>

    <div class="sheet-inner">
      <section class="section host-cta">
        <h3>Tem um lugar ou garagem livre?</h3>
        <p>Arrende-o à hora, ao dia ou ao mês e ganhe com o espaço que não usa. Com carregador, ainda melhor.</p>
        <a class="btn small" href="/anfitriao.html">Arrendar o meu lugar</a>
      </section>

      <hr class="divider">

      <section class="section">
        <h2>Estacionar no Porto</h2>
        <div class="zones" id="zones"></div>
      </section>
    </div>
  </main>

  <!-- Painel de pesquisa -->
  <div class="search-panel hidden" id="panel" role="dialog" aria-modal="true" aria-label="Pesquisa">
    <div class="panel-card">
      <div class="panel-head">
        <button class="icon-btn" id="close-search" type="button" aria-label="Fechar" data-icon="close"></button>
        <b>Pesquisa</b><span style="width:40px"></span>
      </div>
      <div class="search-box">
        <h3>Onde?</h3>
        <div class="input-wrap">
          <input class="input" id="where" list="zone-list" placeholder="Zona, rua ou local (ex.: Boavista)" autocomplete="off">
          <button class="icon-btn eye" id="locate" type="button" aria-label="Usar a minha localização" data-icon="target"></button>
        </div>
        <datalist id="zone-list"></datalist>
      </div>
      <div class="search-box">
        <h3>Quando?</h3>
        <div class="field"><label for="start">Início</label><input class="input" id="start" type="datetime-local"></div>
        <div class="field" style="margin:0"><label for="end">Fim</label><input class="input" id="end" type="datetime-local"></div>
      </div>
      <div class="search-box">
        <h3>Veículo</h3>
        <div class="chips" id="veh"></div>
      </div>
      <div class="search-actions">
        <button class="text-btn" id="clear" type="button">Limpar tudo</button>
        <button class="btn orange" id="do-search" type="button"><span data-icon="search"></span>Pesquisar</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js?v=0.2b"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/sebalca/plataforma-core@main/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    PNC.renderChrome({ active: 'Explorar' });
    const $ = id => document.getElementById(id);
    const esc = PNC.esc;

    // ---------- Estado da pesquisa (na URL, para partilhar) ----------
    const qs = new URLSearchParams(location.search);
    const state = {
      cat: qs.get('cat') || 'todos',
      where: qs.get('onde') || '',
      start: qs.get('inicio') || '',
      end: qs.get('fim') || '',
      veh: qs.get('veiculo') || 'carro',
      // Localização: por agora fixa em São Mamede de Infesta (fictícia); o GPS substitui-a quando pedido
      near: { lat: PNC.DEFAULT_LOC.lat, lng: PNC.DEFAULT_LOC.lng },
      locality: PNC.DEFAULT_LOC.locality,
      gps: false,
    };
    function syncUrl() {
      const p = new URLSearchParams();
      if (state.cat !== 'todos') p.set('cat', state.cat);
      if (state.where) p.set('onde', state.where);
      if (state.start) p.set('inicio', state.start);
      if (state.end) p.set('fim', state.end);
      if (state.veh !== 'carro') p.set('veiculo', state.veh);
      history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
    }
    const fmtDate = s => s ? new Date(s).toLocaleString('pt-PT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    function renderSummary() {
      const vehLabel = (PNC.VEHICLES.find(v => v[0] === state.veh) || [, 'Carro'])[1];
      const when = state.start ? `${fmtDate(state.start)}${state.end ? ' – ' + fmtDate(state.end) : ''}` : 'Qualquer altura';
      const where = state.where || state.locality;
      $('sb-main').textContent = where;
      $('sb-sub').textContent = `${when} · ${vehLabel}`;
      $('f-where').textContent = where;
      $('f-when').textContent = when;
      $('f-veh').textContent = vehLabel;
    }

    // ---------- Categorias ----------
    $('cats').innerHTML = PNC.CATEGORIES.map(c =>
      `<button class="cat ${c.id === state.cat ? 'on' : ''}" data-cat="${c.id}" role="tab" aria-selected="${c.id === state.cat}">${PNC.icon(c.icon)}<span>${c.label}</span></button>`
    ).join('');
    $('cats').addEventListener('click', e => {
      const b = e.target.closest('.cat'); if (!b) return;
      state.cat = b.dataset.cat;
      document.querySelectorAll('.cat').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
      syncUrl(); render();
    });

    // ---------- Zonas (inspiração) ----------
    $('zones').innerHTML = PNC.ZONES.map(z => `<a href="/?onde=${encodeURIComponent(z)}">${z}<span>Estacionamento</span></a>`).join('');
    $('zone-list').innerHTML = PNC.ZONES.map(z => `<option value="${z}">`).join('');

    // ---------- Localização (GPS real, a pedido) ----------
    async function useGps() {
      if (!navigator.geolocation) return PNC.toast('Localização indisponível neste dispositivo.', 'err');
      PNC.toast('A obter a sua localização…');
      navigator.geolocation.getCurrentPosition(async p => {
        state.near = { lat: p.coords.latitude, lng: p.coords.longitude }; state.gps = true;
        state.locality = await localityOf(state.near);
        state.where = ''; syncUrl(); renderSummary(); render();
        PNC.toast(`Localização: ${state.locality}`);
      }, () => PNC.toast('Não foi possível obter a localização.', 'err'), { timeout: 10000 });
    }
    // Localidade: freguesia/localidade do OpenStreetMap; se falhar, a zona do lugar mais próximo
    async function localityOf(pos) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=pt&lat=${pos.lat}&lon=${pos.lng}`);
        const a = (await r.json()).address || {};
        const name = a.suburb || a.village || a.town || a.city_district || a.city;
        if (name) return name.replace(/^(União das Freguesias de |Freguesia de )/, '');
      } catch (e) {}
      const near = [...listings].sort((x, y) => dist(x) - dist(y))[0];
      return near ? near.zone : 'Porto';
    }
    const dist = l => l.approx_lat == null ? Infinity : PNC.distance(state.near, { lat: l.approx_lat, lng: l.approx_lng });
    const sameZone = (a, b) => (a || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') === (b || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

    // ---------- Painel de pesquisa ----------
    $('veh').innerHTML = PNC.VEHICLES.map(([id, label]) => `<button class="chip" type="button" data-v="${id}">${label}</button>`).join('');
    function openPanel() {
      $('where').value = state.where; $('start').value = state.start; $('end').value = state.end;
      document.querySelectorAll('#veh .chip').forEach(c => c.classList.toggle('on', c.dataset.v === state.veh));
      $('panel').classList.remove('hidden'); $('where').focus();
    }
    $('open-search').onclick = openPanel;
    $('close-search').onclick = () => $('panel').classList.add('hidden');
    $('veh').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; document.querySelectorAll('#veh .chip').forEach(x => x.classList.toggle('on', x === c)); };
    $('clear').onclick = () => { $('where').value = ''; $('start').value = ''; $('end').value = ''; document.querySelectorAll('#veh .chip').forEach(x => x.classList.toggle('on', x.dataset.v === 'carro')); };
    $('locate').onclick = () => { $('panel').classList.add('hidden'); useGps(); };
    $('do-search').onclick = () => {
      state.where = $('where').value.trim();
      state.start = $('start').value; state.end = $('end').value;
      if (state.start && state.end && state.end <= state.start) return PNC.toast('O fim tem de ser depois do início.', 'err');
      const v = document.querySelector('#veh .chip.on'); state.veh = v ? v.dataset.v : 'carro';
      $('panel').classList.add('hidden');
      syncUrl(); renderSummary(); render();
    };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('panel').classList.add('hidden'); });

    // ---------- Lugares ----------
    let listings = [];
    const priceShort = l => l.price_hour ? PNC.euro(l.price_hour, '/h') : l.price_day ? PNC.euro(l.price_day, '/dia') : PNC.euro(l.price_month, '/mês');
    function card(l) {
      const photo = PNC.photoUrl(l.cover_photo);
      const av = PNC.availability(l);
      const d = dist(l);
      const extra = l.has_charger ? `Carregador ${l.charger_kw ? String(l.charger_kw).replace('.', ',') + ' kW' : ''}` : (l.is_covered ? 'Coberto' : 'Descoberto');
      return `<div class="card ${av.key !== 'disponivel' ? 'is-busy' : ''}">
        <div class="card-photo" style="${photo ? `background-image:url('${photo}')` : ''}">
          ${photo ? '' : PNC.icon('garage')}
          ${l.has_charger ? `<span class="card-badge">${PNC.icon('bolt')} Carregador</span>` : ''}
          ${l.is_demo ? '<span class="card-demo">Exemplo</span>' : ''}
          <button class="card-fav" type="button" aria-label="Guardar nos favoritos" data-fav="${l.id}">${PNC.icon('heart')}</button>
        </div>
        <div class="card-body">
          <div class="card-row"><span class="card-title">${esc(l.title)}</span><span class="card-rating">${PNC.icon('star')} Novo</span></div>
          <div class="card-sub">${esc(l.zone)}${isFinite(d) ? ' · ' + PNC.walkText(d) : ''}</div>
          <div class="card-sub">${esc(extra)}</div>
          <div class="avail av-${av.key}">${esc(av.label)}</div>
          <div class="card-price"><b>${PNC.mainPrice(l)}</b></div>
        </div>
      </div>`;
    }
    // filtros de veículo e categoria (aplicam-se a tudo)
    function filtered() {
      const cat = PNC.CATEGORIES.find(c => c.id === state.cat);
      let out = listings.filter(l => (l.vehicle_types || ['carro']).includes(state.veh));
      if (cat && cat.match) out = out.filter(cat.match);
      return out;
    }

    // ---------- Mapa "Perto de si" ----------
    let map, layer;
    const MAX_PINS = 8, MAX_KM = 5;
    function drawMap(list) {
      const el = $('map');
      if (!el) return;
      if (!window.L) { el.innerHTML = '<div class="map-empty">Mapa indisponível sem ligação.</div>'; return; }
      if (!map || !document.body.contains(map.getContainer())) {
        map = L.map(el, { scrollWheelZoom: false, zoomControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        layer = L.layerGroup().addTo(map);
      }
      layer.clearLayers();
      L.marker([state.near.lat, state.near.lng], { icon: L.divIcon({ className: '', html: '<div class="pin-me"></div>', iconSize: [0, 0] }), zIndexOffset: 1000 })
        .bindPopup(`<b>${state.gps ? 'Está aqui' : 'Localização simulada'}</b>${esc(state.locality)}`).addTo(layer);
      const avail = list.filter(l => PNC.availability(l).key === 'disponivel' && dist(l) <= MAX_KM * 1000)
        .sort((a, b) => dist(a) - dist(b)).slice(0, MAX_PINS);
      // pinos na mesma posição aproximada: afastar ligeiramente para não se sobreporem
      const seen = {};
      avail.forEach(l => {
        const k = l.approx_lat + ',' + l.approx_lng, n = seen[k] = (seen[k] || 0) + 1;
        const lat = l.approx_lat + (n - 1) * 0.0007, lng = l.approx_lng + (n - 1) * 0.0009;
        L.marker([lat, lng], { icon: L.divIcon({ className: '', html: `<span class="pin-price ${l.has_charger ? 'charge' : ''}">${l.has_charger ? '⚡ ' : ''}${priceShort(l)}</span>`, iconSize: [0, 0] }) })
          .bindPopup(`<b>${esc(l.title)}</b>${esc(l.zone)} · ${PNC.walkText(dist(l))}<br>${PNC.mainPrice(l)}${l.is_demo ? ' · <i>Exemplo</i>' : ''}<br><small>Localização aproximada</small>`)
          .addTo(layer);
      });
      const pts = [[state.near.lat, state.near.lng], ...avail.map(l => [l.approx_lat, l.approx_lng])];
      if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); else map.setView(pts[0], 14);
      setTimeout(() => map.invalidateSize(), 50);
      return avail.length;
    }

    function render() {
      const content = $('content');
      const list = filtered();
      // Pesquisa por texto → grelha de resultados
      if (state.where) {
        const w = state.where.toLowerCase();
        const res = list.filter(l => (l.zone || '').toLowerCase().includes(w) || (l.title || '').toLowerCase().includes(w)).sort((a, b) => dist(a) - dist(b));
        content.innerHTML = res.length
          ? `<section class="section"><div class="section-head"><h2>${res.length} ${res.length === 1 ? 'lugar' : 'lugares'} em ${esc(state.where)}</h2><a href="/">Limpar pesquisa</a></div><div class="grid-cards">${res.map(card).join('')}</div></section>`
          : `<section class="section"><h2>Sem resultados</h2><div class="empty-card"><strong>Nenhum lugar corresponde à pesquisa</strong>Experimente outra zona, categoria ou veículo.</div></section>`;
        return;
      }
      // Vista normal: mapa + localidade + outras zonas
      const local = list.filter(l => sameZone(l.zone, state.locality)).sort((a, b) => {
        const o = { disponivel: 0, fechada: 1, ocupada: 2 };
        return o[PNC.availability(a).key] - o[PNC.availability(b).key] || dist(a) - dist(b);
      });
      const others = {};
      list.filter(l => !sameZone(l.zone, state.locality)).sort((a, b) => dist(a) - dist(b)).forEach(l => (others[l.zone] = others[l.zone] || []).push(l));
      const nAvailLocal = local.filter(l => PNC.availability(l).key === 'disponivel').length;
      content.innerHTML = `
        <section class="section" id="sec-map">
          <h2>Perto de si</h2>
          <div class="map-bar">
            <span class="muted" id="map-note"></span>
            <button class="text-btn" id="gps" type="button">${state.gps ? 'Atualizar localização' : 'Usar a minha localização'}</button>
          </div>
          <div class="map-big" id="map" aria-label="Mapa com os lugares disponíveis mais próximos"></div>
        </section>
        <section class="section" id="sec-local">
          <div class="section-head"><h2>Garagens em ${esc(state.locality)}</h2><span class="muted">${local.length ? `${nAvailLocal} de ${local.length} disponíveis agora` : ''}</span></div>
          ${local.length ? `<div class="grid-cards">${local.map(card).join('')}</div>`
            : `<div class="empty-card"><strong>Ainda não há lugares em ${esc(state.locality)}</strong>Veja as zonas perto ou seja o primeiro a publicar um lugar aqui.</div>`}
        </section>
        ${Object.keys(others).map(z => `
          <section class="section">
            <div class="section-head"><h2>Lugares em ${esc(z)}</h2><a href="/?onde=${encodeURIComponent(z)}">Ver todos ›</a></div>
            <div class="rail">${others[z].slice(0, 10).map(card).join('')}</div>
          </section>`).join('')}`;
      $('gps').onclick = useGps;
      const n = drawMap(list);
      $('map-note').textContent = n == null ? '' : n
        ? `${n} ${n === 1 ? 'lugar disponível' : 'lugares disponíveis'} agora perto de ${state.locality}${state.gps ? '' : ' (localização simulada)'}`
        : `Sem lugares disponíveis agora num raio de ${MAX_KM} km.`;
    }
    document.addEventListener('click', e => {
      const f = e.target.closest('[data-fav]'); if (!f) return;
      e.preventDefault(); f.classList.toggle('on');
      PNC.toast('Os favoritos ficam guardados na conta a partir da v0.6.');
    });

    (async () => {
      renderSummary();
      const db = PNC.db();
      if (!db) { listings = []; render(); return; }
      const { data, error } = await db.from('listings')
        .select('id,title,zone,approx_lat,approx_lng,cover_photo,vehicle_types,is_covered,is_underground,is_closed,is_solo,easy_entry,has_charger,charger_kw,price_hour,price_day,price_month,is_demo,demo_occupied,listing_schedule(weekday,opens_at,closes_at)')
        .eq('status', 'ativo').order('approved_at', { ascending: false }).limit(300);
      listings = error ? [] : data;
      render();
    })();
  </script>
</body>
</html>
