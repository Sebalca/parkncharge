<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Favoritos — Parkncharge</title>
  <meta name="theme-color" content="#436E91">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=0.2a">
</head>
<body>
  <div class="page-top"><div class="wrap page"><h1>Favoritos</h1></div></div>
  <main class="sheet"><div class="page" id="content"><div class="spinner"></div></div></main>
  <script src="assets/app.js?v=0.2a"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/sebalca/plataforma-core@main/auth.js"></script>
  <script>
    const host = new URLSearchParams(location.search).get('modo') === 'anfitriao';
    PNC.renderChrome({ active: host && 'Favoritos' === 'Mensagens' ? 'Mensagens' : 'Favoritos', host: host && 'Favoritos' === 'Mensagens' });
    (async () => {
      const c = document.getElementById('content');
      const user = await PNC.currentUser();
      if (!user) {
        c.innerHTML = `<h2>Ainda sem favoritos</h2><p class="muted">Entre na sua conta para ver esta página.</p><a class="btn block" href="/login.html?next=${encodeURIComponent(location.pathname + location.search)}">Entrar</a>`;
        return;
      }
      c.innerHTML = `<div class="empty-card">${PNC.icon('heart')}<strong>Ainda sem favoritos</strong>Carregue no coração de um lugar para o guardar aqui.<br><small>Disponível na v0.6.</small></div>`;
      c.querySelector('svg').style.cssText = 'width:40px;height:40px;color:var(--pnc-blue);margin:0 auto 8px;display:block';
    })();
  </script>
</body>
</html>
