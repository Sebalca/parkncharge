<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reservas — Parkncharge</title>
  <meta name="theme-color" content="#436E91">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=0.5">
</head>
<body>
  <div class="page-top"><div class="wrap page"><h1>Reservas</h1></div></div>
  <main class="sheet">
    <div class="page">
      <div class="chips hidden" id="tabs" role="tablist" style="margin-bottom:20px">
        <button class="chip on" data-t="proximas" role="tab">Próximas</button>
        <button class="chip" data-t="anteriores" role="tab">Anteriores</button>
        <button class="chip" data-t="canceladas" role="tab">Canceladas</button>
      </div>
      <div id="content"><div class="spinner"></div></div>
    </div>
  </main>

  <script src="assets/app.js?v=0.5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/sebalca/plataforma-core@main/auth.js"></script>
  <script>
    PNC.renderChrome({ active: 'Reservas' });
    const $ = id => document.getElementById(id), esc = PNC.esc, I = PNC.icon, db = PNC.db();
    let tab = 'proximas', rows = [];

    const GROUP = { proximas: ['pedido', 'confirmada', 'decorrer'], anteriores: ['concluida'], canceladas: ['recusada', 'cancelada', 'expirada'] };
    function item(b) {
      const it = b.listings || b.cars || {}, car = !!b.car_id;
      const st = PNC.bookingState(b), [label, cls] = PNC.BOOKING_STATUS[st];
      const photo = PNC.photoUrl(it.cover_photo);
      const href = it.id ? `${car ? '/carro.html' : '/lugar.html'}?id=${it.id}` : '';
      const canCancel = b.status === 'pedido' || (b.status === 'confirmada' && new Date(b.starts_at) > new Date());
      const access = b.status === 'confirmada' && new Date(b.ends_at) > new Date();
      let note = '';
      if (st === 'pedido') note = `Aguarda resposta do anfitrião até ${esc(PNC.fmtDT(b.expires_at))}.`;
      if (st === 'recusada') note = 'O anfitrião recusou o pedido.' + (b.cancel_reason ? ` Motivo: ${esc(b.cancel_reason)}` : '');
      if (st === 'cancelada') note = b.cancelled_by === 'anfitriao' ? `Cancelada pelo anfitrião. Motivo: ${esc(b.cancel_reason || '—')}` : 'Cancelada por si.';
      if (st === 'expirada') note = 'O anfitrião não respondeu a tempo.';
      if (st === 'decorrer') note = car ? 'Aluguer a decorrer.' : 'Estacionamento a decorrer.';
      return `<article class="bk" data-id="${b.id}">
        <a class="bk-thumb" ${href ? `href="${href}"` : ''} style="${photo ? `background-image:url('${photo}')` : ''}">${photo ? '' : I(car ? 'car' : 'garage')}</a>
        <div class="bk-body">
          <div class="bk-top"><span class="status ${cls}">${label}</span>${b.is_demo ? '<span class="tag-demo">Exemplo</span>' : ''}<span class="muted bk-kind">${car ? 'Carro' : 'Lugar'}</span></div>
          <h3>${href ? `<a href="${href}">${esc(it.title || 'Anúncio')}</a>` : esc(it.title || 'Anúncio já não disponível')}</h3>
          <div class="bk-when">${I('calendar')} ${esc(PNC.fmtRange(b.starts_at, b.ends_at))}</div>
          <div class="muted">${esc(it.zone || '')}${b.total_price != null ? ` · <b>${PNC.euro(b.total_price)}</b>` : ''}${b.price_label && b.price_label !== 'Exemplo' ? ` <small>(${esc(b.price_label)})</small>` : ''}</div>
          ${note ? `<div class="bk-note">${note}</div>` : ''}
          <div class="bk-access hidden" id="acc-${b.id}"></div>
          <div class="actions">
            ${access ? `<button class="btn small" data-act="access" data-id="${b.id}">${I('target')} ${car ? 'Local de recolha' : 'Morada e acesso'}</button>` : ''}
            ${st === 'concluida' && href ? `<a class="btn small ghost" href="${href}#avaliacoes">${I('star')} Avaliar</a>` : ''}
            ${it.id ? `<button class="btn small ghost" data-act="msg" data-id="${b.id}">${I('chat')} Mensagem</button>` : ''}
            ${canCancel ? `<button class="btn small danger" data-act="cancel" data-id="${b.id}">${b.status === 'pedido' ? 'Cancelar pedido' : 'Cancelar reserva'}</button>` : ''}
          </div>
        </div>
      </article>`;
    }
    function render() {
      const list = rows.filter(b => GROUP[tab].includes(PNC.bookingState(b)));
      if (tab === 'proximas') list.sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
      $('content').innerHTML = list.length ? `<div class="bk-list">${list.map(item).join('')}</div>`
        : `<div class="empty-card"><strong>${{ proximas: 'Sem reservas marcadas', anteriores: 'Ainda sem reservas concluídas', canceladas: 'Nada cancelado' }[tab]}</strong>${tab === 'proximas' ? '<a href="/">Encontrar um lugar ou carro</a>' : ''}</div>`;
    }
    $('tabs').onclick = e => {
      const c = e.target.closest('.chip'); if (!c) return;
      tab = c.dataset.t; document.querySelectorAll('#tabs .chip').forEach(x => x.classList.toggle('on', x === c)); render();
    };
    $('content').onclick = async e => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const id = btn.dataset.id, b = rows.find(x => x.id === id);
      if (btn.dataset.act === 'msg') return PNC.openConversation(b.car_id ? { car: b.car_id } : { listing: b.listing_id }, btn);
      if (btn.dataset.act === 'access') {
        const box = $('acc-' + id);
        if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
        const { data, error } = await db.rpc('booking_access', { p_booking: id });
        if (error || !data) return PNC.toast('Não foi possível obter a morada.', 'err');
        const map = data.lat ? `https://www.openstreetmap.org/?mlat=${data.lat}&mlon=${data.lng}#map=18/${data.lat}/${data.lng}` : '';
        box.innerHTML = `<b>${esc(data.address)}</b>${data.postal_code ? ' · ' + esc(data.postal_code) : ''}${data.plate ? `<br>Matrícula: <b>${esc(data.plate)}</b>` : ''}
          ${data.instructions ? `<p>${esc(data.instructions)}</p>` : ''}${map ? `<a href="${map}" target="_blank" rel="noopener">Abrir no mapa ›</a>` : ''}`;
        box.classList.remove('hidden');
      }
      if (btn.dataset.act === 'cancel') {
        if (!confirm(b.status === 'pedido' ? 'Cancelar este pedido?' : 'Cancelar esta reserva? O lugar fica livre para outras pessoas.')) return;
        const { error } = await db.from('bookings').update({ status: 'cancelada' }).eq('id', id);
        if (error) return PNC.toast(PNC.dbError(error), 'err');
        PNC.toast('Reserva cancelada.');
        await load(); render();
      }
    };
    async function load() {
      await db.rpc('expire_requests');
      const { data, error } = await db.from('bookings')
        .select('*,listings(id,title,cover_photo,zone),cars(id,title,cover_photo,zone)')
        .eq('driver_id', USER.id).order('starts_at', { ascending: false }).limit(200);
      if (error) { $('content').innerHTML = `<div class="msg err">${PNC.dbError(error)}</div>`; return; }
      rows = data;
    }
    let USER;
    (async () => {
      if (!db) { $('content').innerHTML = '<div class="msg err">Não foi possível ligar ao servidor.</div>'; return; }
      USER = await PNC.currentUser();
      if (!USER) {
        $('content').innerHTML = `<h2>As suas reservas</h2><p class="muted">Entre na sua conta para ver as suas reservas.</p><a class="btn block" href="/login.html?next=/reservas.html">Entrar</a>`;
        return;
      }
      $('tabs').classList.remove('hidden');
      await load(); render();
    })();
  </script>
</body>
</html>
